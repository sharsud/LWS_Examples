<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>404 | Learn With Psudo - Automation Practice Labs</title>
    <link rel="shortcut icon" href="images/logo.ico" />
    <link rel="icon" href="images/logo.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            text-align: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #0ea5e9, #6366f1, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-size: 1.1rem;
        }
        .brand-name {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }
        .brand-name span { color: #0284c7; }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            padding: 3rem 2.5rem;
            max-width: 30rem;
        }
        .status { font-size: 4.5rem; font-weight: 800; letter-spacing: 0.02em; line-height: 1; }
        .status span { background: linear-gradient(90deg, #0284c7, #6366f1); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h1 { margin-top: 0.75rem; font-size: 1.35rem; font-weight: 700; }
        p { margin-top: 0.75rem; color: #475569; font-size: 0.95rem; line-height: 1.6; }
        .actions { margin-top: 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .btn {
            display: inline-block;
            padding: 0.65rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-primary { background: #0284c7; color: #fff; box-shadow: 0 1px 2px rgba(2, 132, 199, 0.4); }
        .btn-primary:hover { transform: translateY(-1px); background: #0369a1; }
        .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { transform: translateY(-1px); background: #e2e8f0; }
    </style>
</head>
<body>
    <a class="brand" href="https://www.learnwithpsudo.com/" style="text-decoration:none; color:inherit;">
        <div class="brand-mark">Ps</div>
        <div class="brand-name">LearnWith<span>Psudo</span></div>
    </a>
    <div class="card">
        <div class="status">4<span>0</span>4</div>
        <h1>This page went on vacation</h1>
        <p>But don't worry, it's probably sipping a piña colada somewhere nice. The page you're looking for doesn't exist here, or maybe it's hiding really well.</p>
        <div class="actions">
            <a class="btn btn-primary" href="https://www.learnwithpsudo.com/examples/">Back to Practice Labs</a>
            <a class="btn btn-secondary" href="https://www.learnwithpsudo.com/">Visit the Homepage</a>
        </div>
    </div>
</body>
</html>
